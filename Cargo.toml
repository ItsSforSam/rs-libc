[package]
name = "rs-libc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = true
[dependencies]
api           = {path = "api"}

[workspace]
members = ["crt0", "api", "api-sys", "utils", "build-utils","arch"]


[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false
# BSD-3 Clause and GPL-2.0 are compatible.

license = "BSD-3-Clause OR GPL-2.0-or-later WITH GCC-exception-2.0"

[build-dependencies]
cc = "1.2.46"

[features]


[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[lib]
crate-type = ["cdylib","lib"]


[workspace.lints.clippy]
